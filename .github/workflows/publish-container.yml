name: 🐳 Publish Container

# Manual image publishing for ad-hoc tags (test images, pr-123, ...).
# Pushes to main already publish sha-<commit> + devel automatically via
# publish-dev-container.yml; use this for other refs/tags on demand.
# Pick the source branch with the workflow_dispatch ref selector (main or
# incubating only) and the image tag via the input. Release-owned tags
# (stable, latest, vX.Y semver) are banned here — they are minted exclusively
# by release.yml. `devel` is banned too: it is owned by publish-dev-container.yml
# so it always tracks the newest main build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker tag to publish (default: test; stable/latest/semver are reserved for release.yml, devel for publish-dev-container.yml)"
        required: false
        type: string
        default: test

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    name: validate
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: 🔍 Validate source branch
        run: |
          # Manual images may only be built from the two long-lived branches.
          case "${{ github.ref_name }}" in
            main|incubating) ;;
            *)
              echo "::error::Manual image publishing must be dispatched on 'main' or 'incubating', not '${{ github.ref_name }}'."
              exit 1
              ;;
          esac

      - name: 🔍 Validate tag
        id: check
        env:
          TAG: ${{ inputs.tag }}   # bound as data, never interpolated into the shell
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^[a-z0-9][a-z0-9._-]{0,127}$'; then
            echo "::error::Invalid Docker tag '$TAG'. Use lowercase alphanumerics, '.', '-', '_' (max 128 chars; must start alnum). Examples: test, pr-123."
            exit 1
          fi
          # stable / latest / semver tags are minted only by release.yml,
          # devel only by publish-dev-container.yml — never manually.
          if printf '%s' "$TAG" | grep -qE '^(stable|latest|devel|v?[0-9]+(\.[0-9]+){1,2})$'; then
            echo "::error::Tag '$TAG' is reserved for the release / dev-image workflows. Use 'test', 'pr-123' or another ad-hoc tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    name: publish
    uses: ./.github/workflows/docker-publish.yml
    with:
      tags: type=raw,value=${{ needs.validate.outputs.tag }}
    secrets: inherit
