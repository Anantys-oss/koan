# Automated dependency updates — weekly PRs for Python requirements, GitHub Actions and the Docker base image.
version: 2
updates:
  - package-ecosystem: pip
    # Python deps: koan/requirements*.txt carry the (unpinned >=) ranges.
    directory: "/koan"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    # Production image (root Dockerfile).
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
